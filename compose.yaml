services:
  resource-service:
    build:
      context: ./resource-service
      dockerfile: Dockerfile
    ports:
      - "8086-8087:8081"
    environment:
      LOGSTASH_DESTINATION: ${LOGSTASH_DESTINATION}
      SPRING_DATASOURCE_URL: ${RESOURCE_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${RESOURCE_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${RESOURCE_DB_PASSWORD}
      EUREKA_DISCOVERY_SERVICE_URL: ${EUREKA_SERVICE_URL}
      AWS_S3_URL: ${LOCALSTACK_SERVICE_URL}
      RABBIT_MQ_HOST: ${RABBIT_MQ_HOST}
      RABBIT_MQ_PORT: ${RABBIT_MQ_PORT}
      RABBIT_MQ_USERNAME: ${RABBIT_MQ_USERNAME}
      RABBIT_MQ_PASSWORD: ${RABBIT_MQ_PASSWORD}
    depends_on:
      logstash:
        condition: service_healthy
      resource-db:
        condition: service_healthy
      localstack:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-discovery-service:
        condition: service_healthy
      storage-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8081/actuator/health | grep -q UP || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  song-service:
    build:
      context: ./song-service
      dockerfile: Dockerfile
    deploy:
      replicas: 2
    ports:
      - "8082-8083:8082"
    environment:
      LOGSTASH_DESTINATION: ${LOGSTASH_DESTINATION}
      SPRING_DATASOURCE_URL: ${SONG_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${SONG_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SONG_DB_PASSWORD}
      EUREKA_DISCOVERY_SERVICE_URL: ${EUREKA_SERVICE_URL}
    depends_on:
      logstash:
        condition: service_healthy
      song-db:
        condition: service_healthy
      eureka-discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8082/actuator/health | grep -q UP || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  storage-service:
    build:
      context: ./storage-service
      dockerfile: Dockerfile
    ports:
      - "8088:8088"
    environment:
      LOGSTASH_DESTINATION: ${LOGSTASH_DESTINATION}
      SPRING_DATASOURCE_URL: ${STORAGE_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${STORAGE_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${STORAGE_DB_PASSWORD}
      EUREKA_DISCOVERY_SERVICE_URL: ${EUREKA_SERVICE_URL}
      AWS_S3_URL: ${LOCALSTACK_SERVICE_URL}
    depends_on:
      logstash:
        condition: service_healthy
      storage-db:
        condition: service_healthy
      localstack:
        condition: service_healthy
      eureka-discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8088/actuator/health | grep -q UP || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  resource-processor:
    build:
      context: ./resource-processor
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    environment:
      LOGSTASH_DESTINATION: ${LOGSTASH_DESTINATION}
      EUREKA_DISCOVERY_SERVICE_URL: ${EUREKA_SERVICE_URL}
      RABBIT_MQ_HOST: ${RABBIT_MQ_HOST}
      RABBIT_MQ_PORT: ${RABBIT_MQ_PORT}
      RABBIT_MQ_USERNAME: ${RABBIT_MQ_USERNAME}
      RABBIT_MQ_PASSWORD: ${RABBIT_MQ_PASSWORD}
    depends_on:
      logstash:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8084/actuator/health | grep -q UP || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  eureka-discovery-service:
    build:
      context: ./eureka-discovery-service
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    environment:
      LOGSTASH_DESTINATION: ${LOGSTASH_DESTINATION}
    depends_on:
      logstash:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  api-gateway-service:
    build:
      context: ./api-gateway-service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      LOGSTASH_DESTINATION: ${LOGSTASH_DESTINATION}
      EUREKA_DISCOVERY_SERVICE_URL: ${EUREKA_SERVICE_URL}
    depends_on:
      logstash:
        condition: service_healthy
      eureka-discovery-service:
        condition: service_healthy
      resource-service:
        condition: service_healthy
      song-service:
        condition: service_healthy
      resource-processor:
        condition: service_healthy
      storage-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8085/actuator/health | grep -q UP || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  resource-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: resource-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - ./init-scripts/resource-db/:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "postgres", "-d", "resource-db"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  song-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: song-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./init-scripts/song-db/:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "postgres", "-d", "song-db"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  storage-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: storage-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - ./init-scripts/storage-db/:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "postgres", "-d", "storage-db"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  localstack:
    container_name: '${LOCALSTACK_DOCKER_NAME:-localstack-main}'
    image: localstack/localstack:4.14.0
    ports:
      - '127.0.0.1:4566:4566' # LocalStack Gateway
      - '127.0.0.1:4510-4559:4510-4559' # external services port range
      - '127.0.0.1:443:443' # LocalStack HTTPS Gateway
    environment:
      - DEBUG=${DEBUG:-0}
      - PERSISTENCE=${PERSISTENCE:-0}
    volumes:
      - '${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack'
      - '/var/run/docker.sock:/var/run/docker.sock'
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:4566/_localstack/health | grep -Eq '\"s3\": \"(available|running)\"'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  rabbitmq:
    image: rabbitmq:latest
    container_name: shop-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  elasticsearch:
    image: elasticsearch:8.17.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  logstash:
    image: logstash:8.17.4
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - "5000:5000"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9600 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  kibana:
    image: kibana:8.17.4
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  kibana-setup:
    image: curlimages/curl:8.11.1
    volumes:
      - ./kibana/dashboards.ndjson:/dashboards.ndjson:ro
    command: >
      -sS --fail-with-body -X POST "http://kibana:5601/api/saved_objects/_import?overwrite=true"
      -H "kbn-xsrf: true" --form file=@/dashboards.ndjson
    depends_on:
      kibana:
        condition: service_healthy

  metricbeat:
    image: elastic/metricbeat:8.17.4
    command: ["--strict.perms=false", "-e"]
    environment:
      GATEWAY_HOST: ${GATEWAY_HOST}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana-setup:
        condition: service_completed_successfully

volumes:
  es-data:
