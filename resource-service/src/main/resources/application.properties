spring.application.name=resource-service
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/resource-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=none

song.service.url=http://song-service
storage.service.url=http://storage-service
storage.service.connect-timeout=2s
storage.service.read-timeout=3s

resilience4j.circuitbreaker.instances.storageService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.storageService.sliding-window-size=10
resilience4j.circuitbreaker.instances.storageService.minimum-number-of-calls=6
resilience4j.circuitbreaker.instances.storageService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.storageService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.storageService.permitted-number-of-calls-in-half-open-state=4
resilience4j.circuitbreaker.instances.storageService.automatic-transition-from-open-to-half-open-enabled=true

storage.service.stub.staging.bucket=staging-mp3-storage
storage.service.stub.staging.path=/staging-files
storage.service.stub.permanent.bucket=permanent-mp3-storage
storage.service.stub.permanent.path=/permanent-files

eureka.client.service-url.defaultZone=${EUREKA_DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}

# Frequency of heartbeats sent by the client to the server
eureka.instance.lease-renewal-interval-in-seconds=5
# Frequency of registry data retrieval from the server to the client's local cache
eureka.client.registry-fetch-interval-seconds=5

aws.s3.url=${AWS_S3_URL:http://localhost:4566}
aws.s3.region=eu-central-1
aws.accessKeyId=${AWS_ACCESS_KEY_ID:test}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY:test}

spring.rabbitmq.host=${RABBIT_MQ_HOST:localhost}
spring.rabbitmq.port=${RABBIT_MQ_PORT:5672}
spring.rabbitmq.username=${RABBIT_MQ_USERNAME:guest}
spring.rabbitmq.password=${RABBIT_MQ_PASSWORD:guest}
spring.cloud.stream.output-bindings=id-stored
spring.cloud.stream.bindings.id-stored.destination=exchange-resource-id
spring.cloud.stream.bindings.id-stored.producer.required-groups=resource-processor

spring.cloud.function.definition=resourceProcessedConsumer
spring.cloud.stream.bindings.resourceProcessedConsumer-in-0.destination=exchange-resource-processed
spring.cloud.stream.bindings.resourceProcessedConsumer-in-0.group=resource-service

management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.instance=${HOSTNAME:localhost}
