spring.application.name=api-gateway-service

server.port=8085

spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=false

spring.cloud.gateway.server.webmvc.routes[0].id=resource-service-route
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://resource-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/resources/**

spring.cloud.gateway.server.webmvc.routes[1].id=song-service-route
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://song-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/songs/**

spring.cloud.gateway.server.webmvc.routes[2].id=storage-service-route
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://storage-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/storages/**

spring.cloud.gateway.server.webmvc.routes[3].id=monitoring-resource-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://resource-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/monitoring/resource-service/prometheus
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=SetPath=/actuator/prometheus

spring.cloud.gateway.server.webmvc.routes[4].id=monitoring-song-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://song-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/monitoring/song-service/prometheus
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=SetPath=/actuator/prometheus

spring.cloud.gateway.server.webmvc.routes[5].id=monitoring-storage-service
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://storage-service
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/monitoring/storage-service/prometheus
spring.cloud.gateway.server.webmvc.routes[5].filters[0]=SetPath=/actuator/prometheus

spring.cloud.gateway.server.webmvc.routes[6].id=monitoring-resource-processor
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://resource-processor
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/monitoring/resource-processor/prometheus
spring.cloud.gateway.server.webmvc.routes[6].filters[0]=SetPath=/actuator/prometheus


eureka.client.service-url.defaultZone=${EUREKA_DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
# Frequency of heartbeats sent by the client to the server
eureka.instance.lease-renewal-interval-in-seconds=5
# Frequency of registry data retrieval from the server to the client's local cache
eureka.client.registry-fetch-interval-seconds=5

management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.instance=${HOSTNAME:localhost}
