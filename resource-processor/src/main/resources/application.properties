spring.application.name=resource-processor

server.port=8084

song.service.url=http://song-service
resource.service.url=http://resource-service


eureka.client.service-url.defaultZone=${EUREKA_DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=true
# Frequency of registry data retrieval from the server to the client's local cache
eureka.client.registry-fetch-interval-seconds=5

spring.rabbitmq.host=${RABBIT_MQ_HOST:localhost}
spring.rabbitmq.port=${RABBIT_MQ_PORT:5672}
spring.rabbitmq.username=${RABBIT_MQ_USERNAME:guest}
spring.rabbitmq.password=${RABBIT_MQ_PASSWORD:guest}

spring.cloud.function.definition=resourceCreatedConsumer
spring.cloud.stream.bindings.resourceCreatedConsumer-in-0.destination=exchange-resource-id
spring.cloud.stream.bindings.resourceCreatedConsumer-in-0.group=resource-processor